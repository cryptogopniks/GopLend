[workspace]
members = [
    "contracts/*",
    "packages/*",
    # "tests"
]
exclude = []
resolver = "2"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[workspace.dependencies]
cosmwasm-schema = "1.5.0"
cosmwasm-std = { version = "1.5.4", features = ["stargate"] }
cw-storage-plus = "1.1.0"
cw2 = "1.1.0"
cw20 = "1.0.1"
cw20-base = { version = "1.0.1", features = ["library"] }
sg721 = "3.14.0"
sg721-base = { version = "3.14.0", features = ["library"] }
cw721 = "0.18.0"
cw721-base = { version = "0.18.0", features = ["library"] }
osmosis-std = "0.21.0"
serde = "1.0.163"
strum = "0.24.1"
strum_macros = "0.24.3"
thiserror = "1.0.40"
anyhow = "1.0.71"
cw-multi-test = "0.17.0"
speculoos = "0.11.0"
semver = "1.0.20"
sg-index-query = "0.1.1"
cw-address-like = "1.0.4"

goplend-base = { path = "./packages/goplend-base" }
stargaze-mocks-marketplace = { path = "./packages/stargaze_mocks_marketplace" }

lending-platform = { path = "./contracts/lending-platform" }
oracle = { path = "./contracts/oracle" }
minter = { path = "./contracts/minter" }
scheduler = { path = "./contracts/scheduler" }
marketplace = { path = "./contracts/marketplace" }
market-maker = { path = "./contracts/market-maker" }

stargaze-marketplace-v2 = { git = "https://github.com/public-awesome/marketplace.git", rev = "cb300b15e2ba6e60058955cb4f58a06dcb638d28", version = "0.7.0", features = ["library"] }
stargaze-royalty-registry = { git = "https://github.com/public-awesome/core.git", rev = "6982c764996ea3fa0cbad4b4404a117f55f4c564", version = "0.3.0", features = ["library"] }
