[workspace]
members = ["contracts/*", "packages/*", "tests"]
exclude = []
resolver = "2"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[workspace.dependencies]
cosmwasm-schema = "1.5.0"
cosmwasm-std = "1.5.4"
cw-storage-plus = "1.1.0"
cw2 = "1.1.0"
cw20 = "1.0.1"
cw20-base = { version = "1.0.1", features = ["library"] }
cw721 = "0.18.0"
cw721-base = { version = "0.18.0", features = ["library"] }
osmosis-std = "0.21.0"
serde = "1.0.163"
strum = "0.24.1"
strum_macros = "0.24.3"
thiserror = "1.0.40"
anyhow = "1.0.71"
semver = "1.0.20"
cw-gopniks = { git = "https://github.com/cryptogopniks/cw-gopniks", branch = "dev", features = [
    "cw-v1",
    "assets-v1",
    "auth-v1",
    "nft",
] }

# testing
cw-multi-test = { version = "1.2.0", features = ["cosmwasm_1_1"] }
pretty_assertions = "1.4.1"

# packages
goplend-base = { path = "./packages/goplend-base" }

# contracts
lending-platform = { path = "./contracts/lending-platform" }
oracle = { path = "./contracts/oracle" }
minter = { path = "./contracts/minter" }
scheduler = { path = "./contracts/scheduler" }
market-maker = { path = "./contracts/market-maker" }
