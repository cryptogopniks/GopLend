[workspace]
members = [
    "contracts/*",
    "packages/*",
    "tests"
]
exclude = []
resolver = "2"

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true

[workspace.dependencies]
cosmwasm-schema = "1.5.0"
cosmwasm-std = "1.5.4"
cw-storage-plus = "1.1.0"
cw2 = "1.1.0"
cw20 = "1.0.1"
cw20-base = { version = "1.0.1", features = ["library"] }
cw721 = "0.18.0"
cw721-base = { version = "0.18.0", features = ["library"] }
kujira = "1.0.1"
osmosis-std = "0.20.1"
anybuf = "0.5.0"
serde = "1.0.163"
strum = "0.24.1"
strum_macros = "0.24.3"
thiserror = "1.0.40"
anyhow = "1.0.71"
cw-multi-test = "0.17.0"
speculoos = "0.11.0"
semver = "1.0.20"
bech32 = "0.11.0"

goplend-base = { path = "./packages/goplend-base" }
stargaze-mocks-marketplace = { path = "./packages/stargaze_mocks_marketplace" }

lending-platform = { path = "./contracts/lending-platform" }
oracle = { path = "./contracts/oracle" }
minter = { path = "./contracts/minter" }
minter-kujira = { path = "./contracts/minter-kujira" }
adapter-scheduler-common = { path = "./contracts/adapter-scheduler-common" }
adapter-scheduler-stargaze = { path = "./contracts/adapter-scheduler-stargaze" }
adapter-marketplace-kujira = { path = "./contracts/adapter-marketplace-kujira" }
adapter-marketplace-stargaze = { path = "./contracts/adapter-marketplace-stargaze" }
adapter-dex-stargaze = { path = "./contracts/adapter-dex-stargaze" }

sg-marketplace = { git = "https://github.com/public-awesome/marketplace.git", version = "1.4.0", features = ["library"] }
# stargaze-marketplace-v2 = "0.1.0"
# infinity-factory = { git = "https://github.com/public-awesome/infinity-swap-contracts.git", version = "0.3.0" }
